services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.dibberlab.me
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.dibberlab.me/
      - N8N_EDITOR_BASE_URL=https://n8n.dibberlab.me/
      - N8N_ENCRYPTION_KEY=dibber_nexus_secure_2026_key
      # This ensures n8n knows exactly which DB type to initialize
      - N8N_DB_TYPE=sqlite
    volumes:
      - n8n_data_persistent:/home/node/.n8n

volumes:
  n8n_data_persistent:
    driver: local